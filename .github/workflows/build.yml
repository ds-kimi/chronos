name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The module is 32-bit because srcds is. Everything here is Win32 on purpose.
env:
  # Pinned so an upstream change cannot break a release build without a commit
  # here saying so. Bump it deliberately.
  GMCOMMON_REF: f77a18d86f780a59ea30e4237016b05b790d4b70

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch garrysmod_common
        run: |
          git clone https://github.com/danielga/garrysmod_common.git
          cd garrysmod_common
          git checkout ${{ env.GMCOMMON_REF }}
          git submodule update --init --recursive

      - uses: microsoft/setup-msbuild@v2

      # garrysmod_common's generator calls flags("MultiProcessorCompile"), which
      # upstream premake dropped. Use danielga's own premake build, which keeps it.
      - name: Fetch premake5
        shell: pwsh
        run: |
          $url = "https://github.com/danielga/garrysmod_common/releases/download/premake-build%2F5.0.0-beta8/premake-5.0.0-beta8-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile premake.zip
          Expand-Archive -Path premake.zip -DestinationPath premake -Force

      - name: Generate project
        run: ./premake/premake5.exe --gmcommon=garrysmod_common vs2022

      - name: Build
        run: msbuild projects/windows/vs2022/chronos.sln /p:Configuration=Release /p:Platform=Win32 /m

      # Laid out the way it has to land in a garrysmod folder, so the zip is
      # extracted straight over it rather than read and rearranged by hand.
      - name: Stage the addon
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter gmsv_chronos_win32.dll projects |
            Select-Object -First 1
          if (-not $dll) { throw "built module not found" }

          New-Item -ItemType Directory -Force -Path package/addons/chronos/lua, package/lua/bin
          Copy-Item -Recurse addon/lua/autorun package/addons/chronos/lua/
          Copy-Item -Recurse addon/lua/chronos package/addons/chronos/lua/
          Copy-Item $dll.FullName package/lua/bin/
          Copy-Item README.md, LICENSE package/

          Compress-Archive -Path package/* -DestinationPath chronos-win32.zip

      - uses: actions/upload-artifact@v4
        with:
          name: chronos-win32
          path: chronos-win32.zip
          if-no-files-found: error

      # No versioning: every master build replaces the single rolling release.
      - name: Publish the rolling release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Built from ${{ github.sha }}.
          files: chronos-win32.zip
          make_latest: true
